<ul class="pagination mb-0">
    {% if categories.has_previous %}
        <li class="page-item">
            <a href="#" class="page-link ajax-page" data-page="{{ categories.previous_page_number }}">Previous</a>
        </li>
    {% else %}
        <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
    {% endif %}

    {% for page_num in categories.paginator.page_range %}
        <li class="page-item {% if categories.number == page_num %}active{% endif %}">
            <a href="#" class="page-link ajax-page" data-page="{{ page_num }}">{{ page_num }}</a>
        </li>
    {% endfor %}

    {% if categories.has_next %}
        <li class="page-item">
            <a href="#" class="page-link ajax-page" data-page="{{ categories.next_page_number }}">Next</a>
        </li>
    {% else %}
        <li class="page-item disabled"><a class="page-link" href="#">Next</a></li>
    {% endif %}
</ul>
